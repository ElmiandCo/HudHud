<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">HudHud HQ</title>
  <desc id="desc">HudHud's neon hummingbird over a deep cosmic headquarters backdrop.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="42%" r="78%">
      <stop offset="0" stop-color="#26123d"/>
      <stop offset=".38" stop-color="#11091d"/>
      <stop offset="1" stop-color="#050408"/>
    </radialGradient>
    <radialGradient id="nebula" cx="20%" cy="60%" r="65%">
      <stop offset="0" stop-color="#6d1aa5" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#21105c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="42%" cy="35%" r="72%">
      <stop offset="0" stop-color="#4d75ff" stop-opacity=".48"/>
      <stop offset=".5" stop-color="#192c68" stop-opacity=".35"/>
      <stop offset="1" stop-color="#090d20" stop-opacity=".15"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff39dd" stop-opacity=".08"/>
      <stop offset=".42" stop-color="#b178ff" stop-opacity=".95"/>
      <stop offset=".72" stop-color="#16d9ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff39dd" stop-opacity=".1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <ellipse cx="250" cy="470" rx="520" ry="300" fill="url(#nebula)" filter="url(#soft)"/>
  <ellipse cx="1260" cy="280" rx="560" ry="360" fill="#5a0f9a" opacity=".12" filter="url(#soft)"/>
  <g fill="#fff">
    <circle cx="92" cy="90" r="2"/><circle cx="178" cy="310" r="1.5"/><circle cx="290" cy="120" r="1.3"/>
    <circle cx="420" cy="250" r="1.7"/><circle cx="560" cy="92" r="1.2"/><circle cx="760" cy="170" r="1.4"/>
    <circle cx="940" cy="80" r="1.8"/><circle cx="1130" cy="150" r="1.3"/><circle cx="1420" cy="90" r="1.6"/>
    <circle cx="1510" cy="310" r="1.3"/><circle cx="1320" cy="520" r="1.7"/><circle cx="1040" cy="620" r="1.2"/>
    <circle cx="620" cy="590" r="1.4"/><circle cx="360" cy="650" r="1.6"/><circle cx="90" cy="620" r="1.2"/>
  </g>
  <ellipse cx="1080" cy="320" rx="455" ry="235" fill="url(#planet)" stroke="#5c6dff" stroke-opacity=".18" stroke-width="2"/>
  <path d="M620 375 C870 120 1300 115 1545 350" fill="none" stroke="#6e8dff" stroke-opacity=".18" stroke-width="4"/>
  <ellipse cx="1030" cy="420" rx="610" ry="155" fill="none" stroke="url(#ring)" stroke-width="7" transform="rotate(-10 1030 420)" filter="url(#glow)"/>
  <ellipse cx="1030" cy="420" rx="610" ry="155" fill="none" stroke="#d64cff" stroke-opacity=".18" stroke-width="18" transform="rotate(-10 1030 420)" filter="url(#soft)"/>
  <circle cx="1440" cy="500" r="38" fill="#16d9ff" opacity=".72" filter="url(#glow)"/>
  <circle cx="1440" cy="500" r="25" fill="#4c65ff" opacity=".9"/>
  <g transform="translate(820 38) rotate(1 330 300)">
    <image href="/assets/hudhud-logo.svg" x="0" y="0" width="650" height="650" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <path d="M690 688 C920 630 1230 640 1510 704 C1260 748 920 752 690 688Z" fill="#08070d" opacity=".92"/>
  <path d="M710 685 C940 645 1220 652 1480 704" fill="none" stroke="#9b5cff" stroke-opacity=".45" stroke-width="4"/>
</svg>